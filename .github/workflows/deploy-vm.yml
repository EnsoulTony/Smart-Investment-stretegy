name: Deploy to VM

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          if [ -z "${{ secrets.VM_SSH_HOST }}" ] || [ -z "${{ secrets.VM_SSH_PORT }}" ] || [ -z "${{ secrets.VM_SSH_USER }}" ]; then
            echo "Missing one or more required secrets: VM_SSH_HOST, VM_SSH_PORT, VM_SSH_USER"
            exit 1
          fi

          mkdir -p ~/.ssh

          # Try VM_SSH_KEY_B64 first (base64-encoded private key)
          if [ -n "${{ secrets.VM_SSH_KEY_B64 }}" ]; then
            echo "Decoding SSH key from VM_SSH_KEY_B64..."
            if ! printf '%s' "${{ secrets.VM_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/id_rsa 2>&1; then
              echo "ERROR: Failed to decode VM_SSH_KEY_B64"
              exit 1
            fi
          # Fall back to VM_SSH_KEY (raw key, may have newlines)
          elif [ -n "${{ secrets.VM_SSH_KEY }}" ]; then
            echo "Using SSH key from VM_SSH_KEY..."
            printf '%s' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          else
            echo "ERROR: No SSH key provided. Set either VM_SSH_KEY_B64 or VM_SSH_KEY."
            exit 1
          fi

          chmod 600 ~/.ssh/id_rsa
          echo "SSH key set up successfully."
          ssh-keyscan -p "${{ secrets.VM_SSH_PORT }}" -H "${{ secrets.VM_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          set -o pipefail
          ssh -vv -i ~/.ssh/id_rsa -p "${{ secrets.VM_SSH_PORT }}" "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}" "bash /opt/radar-warroom/Smart-Investment-stretegy/infra/vm/deploy.sh" | tee deploy.log

      - name: Deploy log summary (on failure)
        if: failure()
        run: |
          echo "==== deploy log (last 200 lines) ===="
          if [ -f deploy.log ]; then
            tail -n 200 deploy.log
          else
            echo "No deploy log captured."
          fi

