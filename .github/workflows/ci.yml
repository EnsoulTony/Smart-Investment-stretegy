name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  frontend-tests:
    name: Frontend - Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-fund --no-audit

      - name: Run Vitest
        working-directory: frontend
        run: npm run test -- --run

  backend-tests:
    name: Backend - Pytest (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - radar-service
          - news-service
          - research-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/base-requirements.txt
          pip install -r services/${{ matrix.service }}/requirements.txt

      - name: Run pytest
        working-directory: services/${{ matrix.service }}
        run: pytest

  portfolio-service-tests:
    name: Backend - Portfolio Service (Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat > .env << EOF
          DATABASE_URL=postgresql://investment:investment@postgres:5432/investment_db
          GOOGLE_SA_JSON={"type":"service_account","project_id":"test"}
          GOOGLE_SHEET_ID=test-sheet-id
          GOOGLE_SHEET_NAME=test-sheet
          EOF

      - name: Build and run tests in Docker
        run: |
          docker compose up -d --build postgres portfolio-service
          docker compose exec -T portfolio-service pytest -q
        
      - name: Cleanup
        if: always()
        run: docker compose down -v
