name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  frontend-tests:
    name: Frontend - Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-fund --no-audit

      - name: Run Vitest
        working-directory: frontend
        run: npm run test -- --run

  backend-tests:
    name: Backend - Pytest (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - radar-service
          - news-service
          - research-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/base-requirements.txt
          pip install -r services/${{ matrix.service }}/requirements.txt

      - name: Run pytest
        working-directory: services/${{ matrix.service }}
        run: pytest

  portfolio-service-tests:
    name: Backend - Portfolio Service (Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat > .env << EOF
          DATABASE_URL=postgresql://investment:investment@postgres:5432/investment_db
          GOOGLE_SHEET_ID=test-sheet-id
          GOOGLE_SHEET_TRADES_TAB=trades
          EOF

      - name: Prepare optional Google SA secrets override
        if: ${{ secrets.GOOGLE_SA_JSON_BASE64 != '' }}
        run: |
          echo "${{ secrets.GOOGLE_SA_JSON_BASE64 }}" | base64 -d > /tmp/google_sa.json
          cat > docker-compose.secrets.yml << EOF
          services:
            portfolio-service:
              environment:
                GOOGLE_SA_JSON_PATH: /run/secrets/google_sa.json
              volumes:
                - /tmp/google_sa.json:/run/secrets/google_sa.json:ro
          EOF

      - name: Build and run tests in Docker
        run: |
          if [ -f docker-compose.secrets.yml ]; then
            docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d --build postgres portfolio-service
          else
            docker compose up -d --build postgres portfolio-service
          fi
          
          # 等待 Postgres 就绪
          docker compose exec -T postgres sh -c 'until pg_isready -U investment; do sleep 1; done'
          
          # 执行 Alembic migration（创建表结构）
          docker compose exec -T portfolio-service alembic upgrade head
          
          # 运行测试
          docker compose exec -T portfolio-service pytest -q
        
      - name: Cleanup
        if: always()
        run: |
          docker compose down -v
          rm -f /tmp/google_sa.json docker-compose.secrets.yml
