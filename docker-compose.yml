name: smart-investment-strategy
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-investment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-investment}
      POSTGRES_DB: ${POSTGRES_DB:-investment_db}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    ports:
    - 5432:5432
    privileged: true
    security_opt:
    - apparmor:unconfined
    - seccomp:unconfined
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      PORT: 8000
      SERVICE_NAME: api-gateway
      DATABASE_URL: ${DATABASE_URL:-postgresql://investment:investment@postgres:5432/investment_db}
      NEWS_SERVICE_URL: ${NEWS_SERVICE_URL:-http://news-service:8003}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    depends_on:
    - postgres
    ports:
    - 8000:8000
    privileged: true
    security_opt:
    - apparmor:unconfined
    - seccomp:unconfined
  portfolio-service:
    build:
      context: .
      dockerfile: services/portfolio-service/Dockerfile
    environment:
      PORT: 8001
      SERVICE_NAME: portfolio-service
      DATABASE_URL: ${DATABASE_URL:-postgresql://investment:investment@postgres:5432/investment_db}
      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID}
      GOOGLE_SHEET_TRADES_TAB: ${GOOGLE_SHEET_TRADES_TAB:-trades}
      SHEET_COL_USER_ID: ${SHEET_COL_USER_ID:-user_id}
      SHEET_COL_SYMBOL: ${SHEET_COL_SYMBOL:-symbol}
      SHEET_COL_ASSET_CCY: ${SHEET_COL_ASSET_CCY:-asset_ccy}
      SHEET_COL_SIDE: ${SHEET_COL_SIDE:-side}
      SHEET_COL_QUANTITY: ${SHEET_COL_QUANTITY:-quantity}
      SHEET_COL_PRICE: ${SHEET_COL_PRICE:-price}
      SHEET_COL_FEE: ${SHEET_COL_FEE:-fee}
      SHEET_COL_TRADE_DATE: ${SHEET_COL_TRADE_DATE:-trade_date}
      SHEET_COL_BROKER: ${SHEET_COL_BROKER:-broker}
    depends_on:
    - postgres
    ports:
    - 8001:8001
    privileged: true
    security_opt:
    - apparmor:unconfined
    - seccomp:unconfined
  valuation-service:
    build:
      context: .
      dockerfile: services/valuation-service/Dockerfile
    environment:
      PORT: 8005
      SERVICE_NAME: valuation-service
      PORTFOLIO_BASE_URL: http://portfolio-service:8001
    depends_on:
    - portfolio-service
    ports:
    - 8005:8005
    privileged: true
    security_opt:
    - apparmor:unconfined
    - seccomp:unconfined
  indicator-service:
    build:
      context: .
      dockerfile: services/indicator-service/Dockerfile
    environment:
      PORT: 8006
      SERVICE_NAME: indicator-service
      INDICATOR_PROVIDER: stub
      INDICATOR_SCENARIO: default
    ports:
    - 8006:8006
    privileged: true
    security_opt:
    - apparmor:unconfined
    - seccomp:unconfined
  radar-service:
    build:
      context: .
      dockerfile: services/radar-service/Dockerfile
    environment:
      PORT: 8002
      SERVICE_NAME: radar-service
      DATABASE_URL: ${DATABASE_URL:-postgresql://investment:investment@postgres:5432/investment_db}
      PORTFOLIO_BASE_URL: http://portfolio-service:8001
      INDICATOR_BASE_URL: http://indicator-service:8006
    depends_on:
    - postgres
    - portfolio-service
    - indicator-service
    ports:
    - 8002:8002
    privileged: true
    security_opt:
    - apparmor:unconfined
    - seccomp:unconfined
  news-service:
    build:
      context: .
      dockerfile: services/news-service/Dockerfile
    environment:
      PORT: 8003
      SERVICE_NAME: news-service
      DATABASE_URL: ${DATABASE_URL:-postgresql://investment:investment@postgres:5432/investment_db}
    depends_on:
    - postgres
    ports:
    - 8003:8003
    privileged: true
    security_opt:
    - apparmor:unconfined
    - seccomp:unconfined
  research-service:
    build:
      context: .
      dockerfile: services/research-service/Dockerfile
    environment:
      PORT: 8004
      SERVICE_NAME: research-service
      DATABASE_URL: ${DATABASE_URL:-postgresql://investment:investment@postgres:5432/investment_db}
    depends_on:
    - postgres
    ports:
    - 8004:8004
    privileged: true
    security_opt:
    - apparmor:unconfined
    - seccomp:unconfined
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
    - api-gateway
    ports:
    - 8080:4173
    privileged: true
    security_opt:
    - apparmor:unconfined
    - seccomp:unconfined
volumes:
  postgres_data: null
